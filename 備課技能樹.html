<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>備課技能樹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: publisher tabs on top → subject chips → skill tree (left) + unit editor (right, stacks below on phones) */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e8edeb; --ink:#1a2421; --muted:#5b6964; --line:#d6dfdb;
  --hanlin:#1f5fa8; --kangxuan:#c95f22; --nani:#25805f;
  --done:#2f8a57; --doing:#b97e0e; --todo:#97a39f; --danger:#b8383b;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  --accent:var(--hanlin);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211f; --sunk:#141b19; --ink:#e4ebe8; --muted:#97a6a0; --line:#2b3633;
  --hanlin:#74a9ec; --kangxuan:#ef9a62; --nani:#5ec49b;
  --done:#5cc489; --doing:#e6b04c; --todo:#66736e; --danger:#ef7c7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211f; --sunk:#141b19; --ink:#e4ebe8; --muted:#97a6a0; --line:#2b3633;
  --hanlin:#74a9ec; --kangxuan:#ef9a62; --nani:#5ec49b;
  --done:#5cc489; --doing:#e6b04c; --todo:#66736e; --danger:#ef7c7e; color-scheme:dark}
body[data-pub="hanlin"]{--accent:var(--hanlin)}
body[data-pub="kangxuan"]{--accent:var(--kangxuan)}
body[data-pub="nani"]{--accent:var(--nani)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:8px 18px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgb(0 0 0/.12)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:.88rem;color:var(--muted)}
.summary b{font-family:var(--font-num);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{flex:1 1 200px;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{height:100%}
.grades{display:flex;flex-wrap:wrap;gap:10px 18px}
.gset{display:flex;align-items:center;gap:6px;min-width:0}
.gset > .lbl{white-space:nowrap;flex:none}
.gset .lbl{font-size:.75rem;color:var(--muted);letter-spacing:.1em;font-weight:700;writing-mode:horizontal-tb;margin-right:2px}
.gbtns{display:flex;gap:6px;flex-wrap:wrap}
.gbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 4px 6px;min-width:52px;display:grid;justify-items:center;gap:3px;line-height:1.2}
.gbtn b{font-size:.92rem}
.gbtn i{display:block;width:36px;height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;font-style:normal}
.gbtn i span{display:block;height:100%;background:var(--done)}
.gbtn small{font-family:var(--font-num);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.gbtn:hover{border-color:var(--accent)}
.gbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--surface)}
.gbtn[aria-pressed="true"] small{color:var(--surface)}
.gbtn[aria-pressed="true"] i{background:color-mix(in srgb,var(--surface) 35%,transparent)}
.gbtn[aria-pressed="true"] i span{background:var(--surface)}
.semseg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.semseg button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted)}
.semseg button+button{border-left:1px solid var(--line)}
.semseg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.srcnote{flex-basis:100%;font-size:.8rem;color:var(--muted);margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.chip small{font-family:var(--font-num);color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.chip.add{border-style:dashed;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 12px;font-size:.85rem}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.primary{border:0;background:var(--accent);color:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;font-size:.88rem}
.danger{border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:8px;padding:5px 12px;font-size:.85rem}
.danger.solid{background:var(--danger);color:var(--surface)}
/* tree */
.tree{list-style:none;margin:0;padding:0}
.node{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.node:last-child{padding-bottom:0}
.node:not(:last-child)::before{content:"";position:absolute;left:27px;top:52px;bottom:-2px;width:3px;border-radius:2px;background:var(--line)}
.node.linked:not(:last-child)::before{background:var(--done)}
.orb{width:56px;height:56px;border:0;background:transparent;padding:0;position:relative}
.orb svg{width:56px;height:56px;display:block}
.orb .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:1.05rem}
.node.done .num{color:var(--done)}
.node.locked .orb,.node.locked .card{opacity:.55}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);text-align:left;width:100%;display:grid;gap:4px;min-width:0}
.card:hover{border-color:var(--accent)}
.node.sel .card{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.card .name{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted);align-items:center}
.pill{white-space:nowrap;font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:99px;letter-spacing:.03em}
.pill.todo{background:color-mix(in srgb,var(--todo) 18%,transparent);color:var(--muted)}
.pill.doing{background:color-mix(in srgb,var(--doing) 18%,transparent);color:var(--doing)}
.pill.done{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}
.addunit{margin-top:14px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:10px;color:var(--muted)}
.addunit:hover{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
/* editor */
.editor{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 4px;font-size:.88rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].todo{background:var(--todo);color:var(--surface)}
.seg button[aria-pressed="true"].doing{background:var(--doing);color:var(--surface)}
.seg button[aria-pressed="true"].done{background:var(--done);color:var(--surface)}
.order{display:flex;gap:6px;align-items:center;font-size:.88rem}
.order b{font-family:var(--font-num);margin-right:auto}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.checks input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.checks li.ok span{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--danger)}
.inline{display:grid;grid-template-columns:1fr auto;gap:6px}
.kv{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto;gap:6px;align-items:center}
.stack{display:grid;gap:6px}
hr{border:0;border-top:1px solid var(--line);margin:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--danger)}
details.backup{font-size:.88rem}
details.backup summary{cursor:pointer;color:var(--muted)}
details.backup .stack{margin-top:10px}
.note{font-size:.8rem;color:var(--muted)}
.msg{font-size:.82rem}
.msg.err{color:var(--danger)} .msg.ok{color:var(--done)}
.syncbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.82rem;color:var(--muted)}
.modeseg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.modeseg button{border:0;background:transparent;padding:5px 12px;font-size:.82rem;color:var(--muted);font-weight:500}
.modeseg button+button{border-left:1px solid var(--line)}
.modeseg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--todo);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--done)} .dot.busy{background:var(--doing)} .dot.err{background:var(--danger)}
.week{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 16px;display:grid;gap:10px;min-width:0}
.week-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.week-head h2{font-size:1rem}
.week-head h2 b{font-family:var(--font-num);color:var(--accent);font-size:1.25rem}
.week-list{display:flex;flex-wrap:wrap;gap:6px}
.wk-item{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:.84rem;display:flex;gap:6px;align-items:center;text-align:left;max-width:100%}
.wk-item:hover{border-color:var(--accent)}
.wk-item .subj{color:var(--muted);font-size:.76rem;white-space:nowrap}
.wk-item .nm{overflow-wrap:anywhere}
.wk-item.late{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.wk-label{font-size:.76rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.wk-label.late{color:var(--danger)}
.wk-set{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}
.wk-set .field{min-width:150px}
.pill.now{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.chip .late{color:var(--danger);font-size:.75rem;font-weight:700}
.links{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.links li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.links a{color:var(--accent);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.links a:hover{text-decoration:underline}
.links .host{display:block;font-size:.74rem;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltype{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.linkform{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px}
.linkform .full{grid-column:1/-1}
.linkform select{width:auto}
.logs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.logs li{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:grid;gap:2px}
.logs .lh{display:flex;gap:8px;align-items:center;font-size:.76rem;color:var(--muted)}
.logs .lh b{font-family:var(--font-num);color:var(--ink);font-variant-numeric:tabular-nums}
.logs .lh .x{margin-left:auto}
.logs p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}
.logform{display:grid;gap:6px}
.logform .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
textarea{resize:vertical;min-height:64px;line-height:1.5}
@media (prefers-reduced-motion:no-preference){.orb circle.prog{transition:stroke-dashoffset .35s ease}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>備課技能樹</h1>
      <p class="sub">依版本 → 年級 → 科目 → 單元順序，逐一點亮每個備課節點</p>
      <div class="syncbar" id="syncbar"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>

  <nav class="grades" id="grades" aria-label="年級"></nav>
  <section class="summary" id="summary"></section>
  <section class="week" id="week" aria-live="polite"></section>
  <div class="chips" id="chips" role="group" aria-label="科目"></div>

  <div class="main">
    <section class="panel" id="treePanel"></section>
    <aside class="panel editor" id="editor"></aside>
  </div>

  <details class="backup panel" id="backup">
    <summary>備份與還原資料</summary>
    <div class="stack">
      <p class="note">「我的進度」會同步到你的 Claude 帳號，「團隊共用」由分享對象一起編輯。也可以複製備份文字另存，要還原時貼回下方再按「匯入」（匯入會覆蓋目前檢視中的進度）。</p>
      <textarea id="backupText" rows="5" placeholder="按「產生備份」後會出現在這裡，或貼上先前的備份文字"></textarea>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="ghost" id="btnExport">產生備份並複製</button>
        <button class="ghost" id="btnImport">匯入</button>
        <button class="ghost" id="btnReset">恢復範例資料</button>
      </div>
      <p class="msg" id="backupMsg" aria-live="polite"></p>
    </div>
  </details>
</div>

<script>
const PUBS=[["hanlin","翰林"],["kangxuan","康軒"],["nani","南一"]];
const ST={todo:"未開始",doing:"備課中",done:"已完成"};
const DEFAULT_CHECKS=["研讀教師手冊","教學簡報","學習單","評量設計"];
const KEY="prep-skill-tree-v3",OLDKEYS=["prep-skill-tree-v2","prep-skill-tree-v1"];
const GRADES=[1,2,3,4,5,6,7,8,9];
const SEMS=["上","下"];
const GNAME=["","一年級","二年級","三年級","四年級","五年級","六年級","七年級","八年級","九年級"];
const GSHORT=["","一","二","三","四","五","六","國一","國二","國三"];
const uid=()=>Math.random().toString(36).slice(2,9);

}
const isDirty=(mode,k)=>SYNC.dirty.has(mode+"|"+k)||SYNC.writing.has(mode+"|"+k);
async function flush(){
  if(!SYNC.db)return;
  const keys=[...SYNC.dirty].filter(k=>!SYNC.writing.has(k));
  let okCount=0;
  for(const dk of keys){
    SYNC.dirty.delete(dk);SYNC.writing.add(dk);
    const [mode,k]=dk.split("|");
    const body=bodyFor(mode,k);
    try{ if(body){await colRef(mode).doc(k).set(JSON.parse(JSON.stringify(body)));okCount++} }
    catch(e){
      const c=e&&e.code;
      if(c==="invalid_argument"&&mode==="team"){SYNC.canWrite=false;setStatus("ro","你在這份共用進度只有檢視權限，變更不會儲存");}
      else if(c==="quota_exceeded"){setStatus("err","雲端空間已滿，變更沒有儲存");}
      else if(c==="unavailable"||c==="resource_exhausted"){SYNC.dirty.add(dk);}
      else {setStatus("err","無法儲存到雲端，變更暫存在這台裝置");}
    }
    finally{SYNC.writing.delete(dk)}
  }
  if(SYNC.dirty.size){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,2500+Math.random()*1500)}
  else if(SYNC.status==="busy"||(SYNC.status==="err"&&okCount))setStatus(SYNC.loaded?"ok":"busy");
}
function editingNow(){const a=document.activeElement;return a&&$("editor").contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)}
function applySnapshot(snap){
  const seen=new Set();
  snap.docs.forEach(d=>{
    seen.add(d.id);
    if(isDirty(SYNC.mode,d.id)||d.metadata.hasPendingWrites)return;
    const data=d.data()||{};
    if(d.id==="meta"){if(data.settings&&typeof data.settings==="object")S.settings={...DEFAULT_SETTINGS,...data.settings};return}
    const x=parseKey(d.id);if(!x||!Array.isArray(data.subjects))return;
    const gs=S.pubs[x.pub].grades[x.g][x.sem];
    gs.subjects=JSON.parse(JSON.stringify(data.subjects));
    if(!gs.subjects.some(z=>z.id===gs.sel)){gs.sel=gs.subjects[0]?.id;gs.unit=gs.subjects[0]?.units[0]?.id}
  });
  return seen;
}
function sig(subs){return JSON.stringify(subs.map(x=>[x.name,x.grade,x.units.map(u=>[u.name,u.status,u.week,u.periods,u.checks.map(c=>[c.t,c.done]),u.fields.map(f=>[f.k,f.v]),(u.links||[]).length,(u.logs||[]).length])]))}
function migrateLocal(seen){ // 第一次連上雲端：把這台裝置上改過、雲端還沒有的進度上傳
  let flag=null;try{flag=localStorage.getItem(KEY+":uploaded:"+SYNC.uid)}catch(e){}
  if(flag)return;
  PUBS.forEach(([p])=>GRADES.forEach(g=>SEMS.forEach(m=>{
    const k=keyOf(p,g,m);if(seen.has(k))return;
    if(sig(S.pubs[p].grades[g][m].subjects)!==sig(semSubjects(p,g,m)))markDirty(k);
  })));
  if(!seen.has("meta")&&JSON.stringify(S.settings)!==JSON.stringify(DEFAULT_SETTINGS))markDirty("meta");
  try{localStorage.setItem(KEY+":uploaded:"+SYNC.uid,"1")}catch(e){}
}
function subscribe(){
  if(SYNC.unsub){SYNC.unsub();SYNC.unsub=null}
  if(!SYNC.db||(SYNC.mode==="mine"&&!SYNC.uid)){setStatus("local");return}
  SYNC.loaded=false;setStatus("busy","連線中");
  clearTimeout(SYNC.loadTimer);
  SYNC.loadTimer=setTimeout(()=>{if(!SYNC.loaded)setStatus("err","暫時連不上雲端，先顯示這台裝置上的資料")},10000);
  const mode=SYNC.mode;
  SYNC.unsub=colRef().onSnapshot(snap=>{
    if(mode!==SYNC.mode)return;
    const seen=applySnapshot(snap);
    if(!snap.metadata.fromCache&&!SYNC.loaded){
      SYNC.loaded=true;clearTimeout(SYNC.loadTimer);
      if(mode==="mine")migrateLocal(seen);
      if(SYNC.status!=="ro")setStatus(SYNC.dirty.size?"busy":"ok");
    }
    if(mode==="mine")saveLocal();
    renderRemote();
  },err=>{clearTimeout(SYNC.loadTimer);setStatus("err",err&&err.code==="revoked"?"雲端同步已停用":"雲端同步中斷，變更暫存在這台裝置")});
}
function switchMode(mode){
  if(mode===SYNC.mode)return;
  if(SYNC.dirty.size)flush();
  const ui={pub:S.pub,grade:P().grade,sem:GR().sem};
  SYNC.mode=mode;try{localStorage.setItem(KEY+":mode",mode)}catch(e){}
  if(mode==="team"&&!TREES.team){TREES.team=defaultState();TREES.team.settings={...DEFAULT_SETTINGS}}
  S=TREES[mode];S.pub=ui.pub;P().grade=ui.grade;GR().sem=ui.sem;

}

/* ---------- 本週進度 ---------- */
function parseWeeks(w){const n=(String(w||"").match(/\d+/g)||[]).map(Number).filter(x=>x>0&&x<30);return n.length?[Math.min(...n),Math.max(...n)]:null}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function toDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function nowInfo(){
  const st=S.settings||DEFAULT_SETTINGS,today=new Date();
  const s2=toDate(st["下"]),s1=toDate(st["上"]);
  const sem=s2&&today>=s2?"下":"上";const start=sem==="下"?s2:s1;if(!start)return null;
  const wk=Math.floor((mondayOf(today)-mondayOf(start))/(7*864e5))+1;
  const mon=mondayOf(today),fri=new Date(mon);fri.setDate(mon.getDate()+4);
  return {sem,wk,range:`${mon.getMonth()+1}/${mon.getDate()}–${fri.getMonth()+1}/${fri.getDate()}`};
}
function unitTiming(u){ // 只在檢視中的學期就是本學期時判斷
  const ni=nowInfo();if(!ni||ni.sem!==GR().sem||ni.wk<1)return "";
  const r=parseWeeks(u.week);if(!r)return "";
  if(r[0]<=ni.wk&&ni.wk<=r[1])return "now";
  if(r[1]<ni.wk&&u.status!=="done")return "late";
  return "";
}
let showWeekSet=false;
function renderWeek(){
  const ni=nowInfo(),box=$("week");
  const setForm=`<div class="wk-set">
    <div class="field"><label for="st1">上學期開學日</label><input type="date" id="st1" value="${esc(S.settings?.["上"]||"")}"></div>

    <button class="primary" id="wkSetDone">完成</button></div>
    <p class="note" style="margin:0">預設依 115 學年度：上學期 8/31、下學期 2/11 開學。第 1 週從開學日那一週算起。</p>`;
  if(!ni){box.innerHTML=`<div class="week-head"><h2>本週進度</h2></div><p class="note" style="margin:0">設定開學日後，就會標出本週該教的單元。</p>${setForm}`;return}
  const head=ni.wk<1?`還沒開學（${ni.sem}學期）`:`本週：${ni.sem}學期第 <b>${ni.wk}</b> 週`;
  let body="";
  if(ni.wk>=1&&ni.sem!==GR().sem){
    body=`<p class="note" style="margin:0">你正在看${GR().sem}學期的單元。</p><div><button class="ghost" id="wkGoSem">切換到${ni.sem}學期</button></div>`;
  }else if(ni.wk>=1){
    const now=[],late=[];
    G().subjects.forEach(sb=>sb.units.forEach(u=>{const t=unitTiming(u);if(t==="now")now.push([sb,u]);else if(t==="late")late.push([sb,u])}));
    const item=([sb,u],cls)=>`<button class="wk-item ${cls}" data-jump="${sb.id}|${u.id}"><span class="subj">${esc(sb.name)}</span><span class="nm">${esc(u.name)}</span><span class="pill ${u.status}">${ST[u.status]}</span></button>`;
    body=`<div class="stack"><span class="wk-label">本週要教（${now.length}）</span>${now.length?`<div class="week-list">${now.map(x=>item(x,"")).join("")}</div>`:`<p class="note" style="margin:0">這週沒有排到單元，或單元還沒填週次。</p>`}</div>`+
      (late.length?`<div class="stack"><span class="wk-label late">進度落後：週次已過但還沒完成（${late.length}）</span><div class="week-list">${late.slice(0,6).map(x=>item(x,"late")).join("")}${late.length>6?`<span class="note" style="align-self:center">還有 ${late.length-6} 個</span>`:""}</div></div>`
      :`<p class="note" style="margin:0">週次已過的單元都完成了。</p>`);
  }
  box.innerHTML=`<div class="week-head"><h2>${head}</h2><span class="note">${ni.wk>=1?ni.range+"・":""}<button class="ghost" id="wkSet" style="padding:2px 8px">${showWeekSet?"收起":"設定開學日"}</button></span></div>${body}${showWeekSet?setForm:""}`;
}

    <form class="linkform" id="linkForm">
      <select id="linkType" aria-label="資源類型">${LTYPES.map(t=>`<option${t===lastLinkType?" selected":""}>${t}</option>`).join("")}</select>
      <input id="linkLabel" placeholder="名稱，例：異分母加減簡報">
      <input class="full" id="linkUrl" inputmode="url" placeholder="網址，例：padlet.com/…" aria-label="網址">
      <button class="ghost full" type="submit">加入資源</button>
      <p class="msg err full" id="linkMsg" aria-live="polite" style="margin:0"></p>
    </form></div>
  <hr>
  <div class="field"><span class="lbl">教學紀錄與反思（${u.logs.length}）</span>
    <form class="logform" id="logForm">
      <div class="row2"><input type="date" id="logDate" value="${todayStr()}" aria-label="日期"><input id="logClass" placeholder="班級，例：501" aria-label="班級"></div>
      <textarea id="logText" placeholder="學生反應、時間掌握、下次要調整的地方……" aria-label="紀錄內容"></textarea>
      <button class="ghost" type="submit" style="justify-self:start">加入紀錄</button>
    </form>
    ${u.logs.length?`<ul class="logs">${[...u.logs].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(g=>`<li><span class="lh"><b>${esc(g.date)}</b>${g.cls?`<span>${esc(g.cls)}</span>`:""}<button class="x" data-dellog="${g.id}" aria-label="刪除這筆紀錄">×</button></span><p>${esc(g.text)}</p></li>`).join("")}</ul>`:`<p class="note" style="margin:0">還沒有紀錄。教完後寫下幾句，明年教同一課時就能參考。</p>`}
  </div>
  <hr>
  ${confirming==="unit"?`<div class="confirm">刪除單元「${esc(u.name)}」？<button class="danger solid" id="uDelYes">確定刪除</button><button class="ghost" id="cancelConfirm">取消</button></div>`
   :`<button class="danger" id="uDel" style="justify-self:start">刪除單元</button>`}`;
}
const LTYPES=["簡報","學習單","Padlet","影片","網站","其他"];
function normUrl(v){v=(v||"").trim();if(!v)return "";if(!/^https?:\/\//i.test(v))v="https://"+v;try{const x=new URL(v);return /^https?:$/.test(x.protocol)&&x.hostname.includes(".")?x.href:""}catch(e){return ""}}
function hostOf(v){try{return new URL(v).hostname.replace(/^www\./,"")}catch(e){return ""}}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function ensureUnit(u){if(u){if(!Array.isArray(u.links))u.links=[];if(!Array.isArray(u.logs))u.logs=[]}return u}
let lastLinkType="簡報";
function renderAll(){renderSync();renderTabs();renderGrades();renderSummary();renderWeek();renderChips();renderTree();renderEditor()}
function soft(){save();renderGrades();renderSummary();renderWeek();renderChips();renderTree()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const s=subj(),u=unit();
  if(t.dataset.pub){const q=S.pubs[t.dataset.pub];location.hash=t.dataset.pub+"-"+q.grade+"-"+(q.grades[q.grade].sem==="下"?2:1);return}
  if(t.dataset.grade){const g=+t.dataset.grade;location.hash=S.pub+"-"+g+"-"+(P().grades[g].sem==="下"?2:1);return}
  if(t.dataset.sem){location.hash=S.pub+"-"+P().grade+"-"+(t.dataset.sem==="下"?2:1);return}
  if(t.dataset.subj){G().sel=t.dataset.subj;const ns=subj();G().unit=ns.units[0]?.id;confirming=null;editingSubject=false;saveLocal();renderAll();return}
  if(t.dataset.mode){switchMode(t.dataset.mode);return}
  if(t.dataset.jump){const [sid,uid2]=t.dataset.jump.split("|");G().sel=sid;G().unit=uid2;confirming=null;editingSubject=false;saveLocal();renderAll();$("treePanel").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.unit){G().unit=t.dataset.unit;confirming=null;saveLocal();renderTree();renderEditor();
    if(matchMedia("(max-width:820px)").matches)$("editor").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.status&&u){u.status=t.dataset.status;if(u.status==="done")u.checks.forEach(c=>c.done=true);save();renderAll();return}
  if(t.dataset.delcheck&&u){u.checks=u.checks.filter(c=>c.id!==t.dataset.delcheck);save();renderAll();return}
  if(t.dataset.dellink&&u){u.links=u.links.filter(l=>l.id!==t.dataset.dellink);save();renderEditor();renderTree();return}
  if(t.dataset.dellog&&u){u.logs=u.logs.filter(g=>g.id!==t.dataset.dellog);save();renderEditor();renderTree();return}
  if(t.dataset.delfield&&u){u.fields=u.fields.filter(f=>f.id!==t.dataset.delfield);save();renderEditor();return}
  switch(t.id){
    case"addSubject":{const ns={id:uid(),name:"新科目",grade:"",units:[]};G().subjects.push(ns);G().sel=ns.id;G().unit=null;editingSubject=true;save();renderAll();$("sName").select();break}
    case"editSubject":editingSubject=true;renderTree();break;
    case"sDone":editingSubject=false;confirming=null;renderTree();break;
    case"sDel":confirming="subject";renderTree();break;
    case"sDelYes":G().subjects=G().subjects.filter(x=>x.id!==s.id);G().sel=G().subjects[0]?.id;G().unit=subj()?.units[0]?.id;confirming=null;editingSubject=false;save();renderAll();break;
    case"cancelConfirm":confirming=null;renderTree();renderEditor();break;
    case"addUnit":{const nu=mkUnit(`第 ${s.units.length+1} 單元`);s.units.push(nu);G().unit=nu.id;save();renderAll();$("uName").select();break}
    case"up":case"down":{const i=s.units.indexOf(u),j=t.id==="up"?i-1:i+1;[s.units[i],s.units[j]]=[s.units[j],s.units[i]];save();renderAll();$(t.id)?.focus();break}
    case"addField":u.fields.push({id:uid(),k:"",v:""});save();renderEditor();$("fk-"+u.fields.at(-1).id).focus();break;
    case"uDel":confirming="unit";renderEditor();break;
    case"uDelYes":{const i=s.units.indexOf(u);s.units.splice(i,1);G().unit=s.units[Math.max(0,i-1)]?.id;confirming=null;save();renderAll();break}
    case"wkSet":showWeekSet=!showWeekSet;renderWeek();break;
    case"wkSetDone":showWeekSet=false;renderWeek();break;
    case"wkGoSem":{const ni=nowInfo();if(ni)location.hash=S.pub+"-"+P().grade+"-"+(ni.sem==="下"?2:1);break}
    case"btnExport":exportData();break;
    case"btnImport":importData();break;
    case"btnReset":
      if(t.dataset.armed){resetTree(defaultState());t.textContent="恢復範例資料";delete t.dataset.armed;msg("已恢復範例資料。","ok")}
      else{t.dataset.armed="1";t.textContent="再按一次確認（會覆蓋目前資料）"}
      break;
  }
});
document.addEventListener("input",e=>{
  const el=e.target,s=subj(),u=unit();
  if(el.id==="sName"&&s){s.name=el.value;save();renderSummary();renderChips();return}
  if(el.id==="sGrade"&&s){s.grade=el.value;save();return}
  if(!u)return;
  if(el.id==="uName"){u.name=el.value;soft()}
  else if(el.id==="uWeek"){u.week=el.value;soft()}
  else if(el.id==="uPer"){u.periods=el.value;soft()}
  else if(el.dataset.fk){u.fields.find(f=>f.id===el.dataset.fk).k=el.value;save()}
  else if(el.dataset.fv){u.fields.find(f=>f.id===el.dataset.fv).v=el.value;save()}
});
document.addEventListener("change",e=>{
  const el=e.target,u=unit();
  if(el.id==="st1"||el.id==="st2"){S.settings={...(S.settings||DEFAULT_SETTINGS),[el.id==="st1"?"上":"下"]:el.value};saveLocal();markDirty("meta");renderWeek();renderChips();renderTree();return}
  if(el.dataset.check&&u){const c=u.checks.find(c=>c.id===el.dataset.check);c.done=el.checked;
    const d=u.checks.filter(c=>c.done).length;
    if(d===u.checks.length&&u.checks.length)u.status="done";else if(d>0)u.status="doing";else if(u.status==="done")u.status="doing";
    save();renderAll();$("ck-"+c.id)?.focus()}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="linkForm"){e.preventDefault();const u=ensureUnit(unit());if(!u)return;
    const url=normUrl($("linkUrl").value);
    if(!url){$("linkMsg").textContent="網址看起來不完整，請貼上完整的網址，例如 https://padlet.com/…";$("linkUrl").focus();return}
    lastLinkType=$("linkType").value;
    u.links.push({id:uid(),type:lastLinkType,label:$("linkLabel").value.trim(),url});save();renderEditor();renderTree();$("linkUrl").focus();return}
  if(e.target.id==="logForm"){e.preventDefault();const u=ensureUnit(unit());if(!u)return;
    const text=$("logText").value.trim();if(!text){$("logText").focus();return}
    u.logs.push({id:uid(),date:$("logDate").value||todayStr(),cls:$("logClass").value.trim(),text});save();renderEditor();renderTree();$("logText").focus();return}
  if(e.target.id!=="checkForm")return;e.preventDefault();
  const u=unit(),v=$("newCheck").value.trim();if(!u||!v)return;
  u.checks.push({id:uid(),t:v,done:false});if(u.status==="done")u.status="doing";save();renderAll();$("newCheck").focus();
});

function msg(t,k){const m=$("backupMsg");m.textContent=t;m.className="msg "+(k||"")}
function exportData(){
  const txt=JSON.stringify(S);$("backupText").value=txt;
  try{navigator.clipboard.writeText(txt).then(()=>msg("備份已複製，可貼到記事本或雲端文件保存。","ok"),()=>{$("backupText").select();msg("無法自動複製，文字已全選，請手動複製。")})}
  catch(err){$("backupText").select();msg("無法自動複製，文字已全選，請手動複製。")}
}
function importData(){
  try{const d=JSON.parse($("backupText").value);let n;if(!valid(d)){if(d&&d.pubs&&d.pubs.hanlin&&d.pubs.hanlin.grades)n=migrateOld(d);else throw 0}else n=d;resetTree(n);msg("已匯入備份資料。","ok")}
  catch(err){msg("無法匯入：請貼上本頁「產生備份」產出的完整文字。","err")}
}
function resetTree(n){
  if(!n.settings)n.settings={...DEFAULT_SETTINGS};
  TREES[SYNC.mode]=n;S=n;saveLocal();markAll();applyHash();
}
function applyHash(){
  const [h,g,m]=location.hash.slice(1).split("-");
  if(PUBS.some(p=>p[0]===h))S.pub=h;
  const gn=parseInt(g,10);if(GRADES.includes(gn))P().grade=gn;
  if(m==="1"||m==="2")GR().sem=m==="2"?"下":"上";
  confirming=null;editingSubject=false;saveLocal();renderAll();
}
window.addEventListener("hashchange",applyHash);
applyHash();
initCloud();
</script>

</body></html>
